# Schema definition for EGOFET Memory Database
# Location: data/memories.db
#
# Templates are NOT stored in the database. They live as YAML files in
# dashboard/templates/*.yaml and are only used to pre-fill fields when a new
# memory is created. Once created, a memory is independent of its template.

tables:
  memories:
    description: "Main table for experiments and comparisons"
    columns:
      id: INTEGER PRIMARY KEY AUTOINCREMENT
      title: TEXT NOT NULL
      type: TEXT NOT NULL DEFAULT 'experiment'  # experiment | comparison
      subtype: TEXT  # device | batch | wafer | session (only for type=experiment)
      date: TEXT NOT NULL  # YYYY-MM-DD
      description: TEXT DEFAULT ''
      substrate: TEXT DEFAULT ''  # Kapton, Si/SiO2, Glass, etc.
      process: TEXT DEFAULT ''  # BAMS, spin-coating, etc.
      created_at: TEXT NOT NULL

  memory_fields:
    description: "Fields of a memory (shown as one list in the dashboard)"
    columns:
      id: INTEGER PRIMARY KEY AUTOINCREMENT
      memory_id: INTEGER NOT NULL REFERENCES memories(id) ON DELETE CASCADE
      field_name: TEXT NOT NULL
      field_value: TEXT DEFAULT ''
      field_type: TEXT NOT NULL DEFAULT 'custom'  # legacy column, not used by the UI

  memory_references:
    description: "References to external files (HDF5, photos, CSVs, figures)"
    columns:
      id: INTEGER PRIMARY KEY AUTOINCREMENT
      memory_id: INTEGER NOT NULL REFERENCES memories(id) ON DELETE CASCADE
      ref_type: TEXT NOT NULL  # hdf5 | photo | csv | figure
      ref_path: TEXT NOT NULL  # relative to project root
      metadata_json: TEXT DEFAULT '{}'

  analysis_results:
    description: "Results from analysis functions"
    columns:
      id: INTEGER PRIMARY KEY AUTOINCREMENT
      memory_id: INTEGER NOT NULL REFERENCES memories(id) ON DELETE CASCADE
      function_name: TEXT NOT NULL
      params_json: TEXT DEFAULT '{}'
      results_csv_path: TEXT  # relative path to CSV in data/processed/
      created_at: TEXT NOT NULL

  tool_runs:
    description: "A dashboard tool applied to an attached file"
    columns:
      id: INTEGER PRIMARY KEY AUTOINCREMENT
      memory_id: INTEGER NOT NULL REFERENCES memories(id) ON DELETE CASCADE
      ref_path: TEXT NOT NULL  # source file the tool ran on (relative to project root)
      tool_name: TEXT NOT NULL
      params_json: TEXT DEFAULT '{}'
      summary_json: TEXT DEFAULT '{}'
      description: TEXT DEFAULT ''
      created_at: TEXT NOT NULL

  tool_run_items:
    description: "One figure, table or image produced by a tool run"
    columns:
      id: INTEGER PRIMARY KEY AUTOINCREMENT
      run_id: INTEGER NOT NULL REFERENCES tool_runs(id) ON DELETE CASCADE
      kind: TEXT NOT NULL  # figure | table | image
      position: INTEGER NOT NULL DEFAULT 0
      label: TEXT DEFAULT ''
      content_json: TEXT DEFAULT '{}'  # plotly figure spec, table records, ...

